spring:
  application:
    name: expedientes-administrativos
    
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
          fetch_size: 50
  
  datasource:
    url: jdbc:oracle:thin:@${DB_HOST:localhost}:1521:${DB_SID:XE}
    username: ${DB_USER:expedientes}
    password: ${DB_PASSWORD:password}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000
  
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  
  security:
    user:
      name: admin
      password: ${ADMIN_PASSWORD:admin123}

server:
  port: 8080
  servlet:
    context-path: /expedientes

# Almacenamiento de documentos
storage:
  filesystem:
    base-path: ${STORAGE_PATH:/opt/expedientes-system/storage}
    max-size-mb: 1000

# Integraciones
integrations:
  portafirmas:
    base-url: ${PORTAFIRMAS_URL:http://localhost:9090}
    api-key: ${PORTAFIRMAS_API_KEY:test-key}
    timeout-seconds: 10
    max-retries: 3
    retry-backoff-ms: [2000, 4000, 8000]
  
  notificaciones:
    email-from: noreply@expedientes.gob.es
    smtp-host: ${SMTP_HOST:smtp.gmail.com}
    smtp-port: ${SMTP_PORT:587}
    max-retries: 3

# LDAP
ldap:
  url: ldap://${LDAP_HOST:localhost}:389
  base-dn: ${LDAP_BASE_DN:dc=example,dc=com}
  user-search-base: ou=users
  user-search-filter: (uid={0})

logging:
  level:
    root: INFO
    com.example.expedientes: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file: ${LOG_PATH:/var/log/expedientes}/application.log

# Flyway DB migrations
flyway:
  locations: classpath:db/migration
  baseline-on-migrate: true
  baseline-version: 0
